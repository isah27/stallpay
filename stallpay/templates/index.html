<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StallPay</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="buyer-page">
  <div id="open-loader" class="open-loader hidden" role="status" aria-live="polite">
    <p id="open-loader-text">Opening the shop…</p>
  </div>

  <header class="top buyer-top">
    <h1>StallPay</h1>
    <label class="lang-picker">
      <span class="sr-only" id="lang-label">Language</span>
      <select id="lang-select" aria-labelledby="lang-label">
        <option value="en" selected>English</option>
        <option value="es">Español</option>
        <option value="hi">हिन्दी</option>
        <option value="pcm">Pidgin</option>
        <option value="fr">Français</option>
      </select>
    </label>
  </header>

  <section class="shops view" id="view-shops">
    <h2 id="shops-heading">Select the shop you want to buy from.</h2>
    <div class="shop-grid">
      {% for shop in shops %}
      <button type="button" class="shop-card" data-shop="{{ shop.id }}" id="shop-{{ shop.id }}">
        <strong>{{ shop.name }}</strong>
        <span>{{ shop.city }}, {{ shop.country }}</span>
        <em>{{ shop.seller_name }}</em>
      </button>
      {% endfor %}
    </div>
  </section>

  <main class="buyer-stage view hidden" id="view-chat">
    <section class="col chat-shell">
      <div class="chat-head">
        <div>
          <h2 id="shop-title">Shop</h2>
          <p class="hint" id="shop-sub"></p>
        </div>
        <button type="button" class="text-btn" id="change-shop-btn" id="change-shop-btn-label">Change shop</button>
      </div>
      <div id="item-chips" class="item-chips" hidden></div>
      <div id="thread" class="thread" role="log" aria-live="polite"></div>
      <form id="chat-form" class="chat-form">
        <label class="sr-only" for="buyer-input">Your message</label>
        <input id="buyer-input" type="text" placeholder="Write a message…" data-i18n-placeholder="input" autocomplete="off" enterkeyhint="send">
        <button type="submit" class="primary" id="send-chat-btn">Send</button>
      </form>
      <p class="deal-status" id="deal-status"></p>

      <div id="pay-card" class="pay-card hidden">
        <h3 id="pay-title">Pay for this order</h3>
        <p id="pay-summary"></p>
        <p><a id="pay-link" href="#" target="_blank" rel="noopener" id="pay-link-label">Pay with PayPal</a></p>
        <div class="actions">
          <button type="button" id="refresh-btn">Refresh payment status</button>
        </div>
        <p class="hint" id="pay-status"></p>
        <div id="proof-panel" class="proof-panel">
          <h3 id="proof-title">Already paid?</h3>
          <p class="hint" id="proof-hint">Send a photo or the text of your receipt and we’ll check it.</p>
          <textarea id="proof-text" rows="4" placeholder="Paste your receipt here…"></textarea>
          <input id="proof-file" type="file" accept="image/*">
          <button type="button" id="proof-btn">Check my payment</button>
          <div id="proof-result"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p class="seller-link"><a href="/seller" id="seller-tools-link">Seller tools</a></p>
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
