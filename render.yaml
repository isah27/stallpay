services:
  - type: web
    name: stallpay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn stallpay.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PAYPAL_MODE
        value: mock
      - key: PYTHON_VERSION
        value: "3.13"
